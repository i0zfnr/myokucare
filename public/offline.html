<!doctype html>
<html lang="ms">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#FF6565">
    <title>Tiada Sambungan — MyOKUcare</title>
    <style>
        *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:#172033;background:#f7f8fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(430px,100%);padding:38px;border:1px solid #e7e9ee;border-radius:22px;background:#fff;box-shadow:0 20px 55px rgba(23,32,51,.09);text-align:center}.mark{width:64px;height:64px;margin:0 auto 22px;display:block;border-radius:18px;object-fit:cover;box-shadow:0 10px 24px rgba(23,32,51,.12)}.status{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;color:#9f2532;background:#fff0ec;font-size:11px;font-weight:800}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#ff6565}h1{margin:18px 0 10px;font-size:27px}p{margin:0;color:#6c7484;font-size:14px;line-height:1.65}button{min-height:46px;margin-top:25px;padding:0 20px;border:0;border-radius:11px;color:#fff;background:linear-gradient(135deg,#ff9064,#ff6565);font-weight:800;cursor:pointer}
    </style>
</head>
<body>
    <main class="card">
        <img class="mark" src="/images/myokucare-logo.png" alt="MyOKUcare">
        <span class="status">Mod luar talian</span>
        <h1>Tiada sambungan internet</h1>
        <p>MyOKUcare memerlukan sambungan untuk memaparkan data terkini dan melindungi maklumat pengguna.</p>
        <button type="button" onclick="location.reload()">Cuba semula</button>
    </main>
</body>
</html>
